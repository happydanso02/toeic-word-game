<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Word Master</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for JSX -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo } = React;

        // --- Firebase SDK Imports via Modules ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- Firebase Constants ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                 apiKey: "AIzaSyB3rsncgQYx6UvA-ibm1S6bQYrKpet41mw",
  authDomain: "toeic-word-game.firebaseapp.com",
  projectId: "toeic-word-game",
  storageBucket: "toeic-word-game.firebasestorage.app",
  messagingSenderId: "182674062232",
  appId: "1:182674062232:web:6aad8a34cc9559f36609ed"
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'toeic-word-master';

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);

        // --- Default Words ---
        const DEFAULT_WORDS = [
            { word: "Candidate", meaning: "후보자, 지원자" },
            { word: "Benefit", meaning: "혜택, 이익" },
            { word: "Procedure", meaning: "절차, 순서" },
            { word: "Announcement", meaning: "발표, 공고" },
            { word: "Application", meaning: "지원서, 신청" },
            { word: "Deadline", meaning: "마감 기한" },
            { word: "Equipment", meaning: "장비, 비품" },
            { word: "Requirement", meaning: "요건, 자격" },
            { word: "Confirmation", meaning: "확인, 확증" },
            { word: "Personnel", meaning: "인원, 인사과" },
            { word: "Contract", meaning: "계약, 약정" },
            { word: "Proposal", meaning: "제안서, 기획안" },
            { word: "Review", meaning: "검토하다, 비평" },
            { word: "Identify", meaning: "확인하다, 식별하다" },
            { word: "Approve", meaning: "승인하다, 찬성하다" },
            { word: "Effective", meaning: "효과적인, 시행되는" },
            { word: "Temporary", meaning: "일시적인, 임시의" },
            { word: "Reference", meaning: "참조, 추천서" },
            { word: "Inventory", meaning: "재고 목록" },
            { word: "Signature", meaning: "서명" }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('home');
            const [words, setWords] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isSeeding, setIsSeeding] = useState(false);
            const [modal, setModal] = useState(null); // { title: string, message: string }

            // Game State
            const [currentIndex, setCurrentIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [gameState, setGameState] = useState('playing');
            const [feedback, setFeedback] = useState(null);
            const [gameWords, setGameWords] = useState([]);

            // Admin State
            const [newWord, setNewWord] = useState('');
            const [newMeaning, setNewMeaning] = useState('');

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) { console.error("Auth error:", error); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const wordsRef = collection(db, 'artifacts', appId, 'public', 'data', 'toeic_words');
                const q = query(wordsRef);
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const wordsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setWords(wordsData);
                    setLoading(false);
                }, (err) => { setLoading(false); });
                return () => unsubscribe();
            }, [user]);

            const showAlert = (title, message) => setModal({ title, message });

            const startNewGame = () => {
                if (words.length < 4) {
                    showAlert("단어 부족", "게임을 시작하려면 최소 4개 이상의 단어가 필요합니다.");
                    return;
                }
                const shuffled = [...words].sort(() => 0.5 - Math.random());
                setGameWords(shuffled.slice(0, 10));
                setCurrentIndex(0);
                setScore(0);
                setGameState('playing');
                setFeedback(null);
                setView('game');
            };

            const currentQuestion = gameWords[currentIndex];

            const options = useMemo(() => {
                if (!currentQuestion || !words.length) return [];
                const correct = currentQuestion.meaning;
                const others = words
                    .filter(w => w.meaning !== correct)
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3)
                    .map(w => w.meaning);
                while(others.length < 3) others.push(`오답_${others.length}`);
                return [correct, ...others].sort(() => 0.5 - Math.random());
            }, [currentQuestion, words]);

            const handleAnswer = (answer) => {
                if (feedback) return;
                const isCorrect = answer === currentQuestion.meaning;
                if (isCorrect) setScore(prev => prev + 1);
                setFeedback({ isCorrect, message: isCorrect ? "정답입니다! 🎉" : `틀렸습니다. 정답은: ${currentQuestion.meaning}` });
                setTimeout(() => {
                    setFeedback(null);
                    if (currentIndex + 1 < gameWords.length) setCurrentIndex(prev => prev + 1);
                    else setGameState('finished');
                }, 1500);
            };

            const handleAddWord = async (e) => {
                e.preventDefault();
                if (!newWord || !newMeaning) return;
                try {
                    const wordsRef = collection(db, 'artifacts', appId, 'public', 'data', 'toeic_words');
                    await addDoc(wordsRef, { word: newWord.trim(), meaning: newMeaning.trim(), createdAt: new Date().toISOString() });
                    setNewWord(''); setNewMeaning('');
                } catch (e) { console.error(e); }
            };

            const handleDeleteWord = async (id) => {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'toeic_words', id));
            };

            const handleSeedDefaultWords = async () => {
                if (isSeeding) return;
                setIsSeeding(true);
                try {
                    const wordsRef = collection(db, 'artifacts', appId, 'public', 'data', 'toeic_words');
                    const existingWordSet = new Set(words.map(w => w.word.toLowerCase()));
                    const wordsToAdd = DEFAULT_WORDS.filter(w => !existingWordSet.has(w.word.toLowerCase()));
                    if (wordsToAdd.length === 0) {
                        showAlert("알림", "이미 모든 기본 단어가 추가되어 있습니다.");
                    } else {
                        for (const item of wordsToAdd) {
                            await addDoc(wordsRef, { ...item, createdAt: new Date().toISOString() });
                        }
                        showAlert("성공", `${wordsToAdd.length}개의 기본 단어가 추가되었습니다.`);
                    }
                } catch (e) { console.error(e); }
                finally { setIsSeeding(false); }
            };

            if (loading) return (
                <div className="flex flex-col items-center justify-center min-h-screen">
                    <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-slate-500 font-medium">데이터 로딩 중...</p>
                </div>
            );

            return (
                <div className="min-h-screen p-4 sm:p-8">
                    <div className="max-w-2xl mx-auto">
                        
                        {/* Custom Modal */}
                        {modal && (
                            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-in">
                                    <h3 className="text-xl font-bold mb-2">{modal.title}</h3>
                                    <p className="text-slate-600 mb-6">{modal.message}</p>
                                    <button onClick={() => setModal(null)} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">확인</button>
                                </div>
                            </div>
                        )}

                        {/* Navigation */}
                        <div className="flex items-center justify-between mb-8 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
                                <div className="bg-blue-600 p-2 rounded-lg text-white">📖</div>
                                <h1 className="text-xl font-bold">TOEIC Master</h1>
                            </div>
                            <button onClick={() => setView('admin')} className={`p-2 rounded-lg ${view === 'admin' ? 'bg-blue-100 text-blue-600' : 'text-slate-400'}`}>⚙️</button>
                        </div>

                        {/* Home View */}
                        {view === 'home' && (
                            <div className="text-center py-10 space-y-6">
                                <div className="text-6xl mb-4">🏆</div>
                                <h2 className="text-3xl font-extrabold">토익 단어 퀴즈</h2>
                                <p className="text-slate-500 font-medium">현재 등록된 단어: <span className="text-blue-600">{words.length}개</span></p>
                                <div className="flex flex-col gap-3 max-w-xs mx-auto pt-4">
                                    <button onClick={startNewGame} className="bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200 hover:scale-105 transition-transform">퀴즈 시작</button>
                                    <button onClick={() => setView('admin')} className="bg-white border border-slate-200 py-4 rounded-2xl font-bold text-slate-700 hover:bg-slate-50">단어 관리</button>
                                </div>
                            </div>
                        )}

                        {/* Game View */}
                        {view === 'game' && (
                            <div className="bg-white rounded-3xl shadow-xl p-6 sm:p-10 animate-in">
                                {gameState === 'playing' ? (
                                    <>
                                        <div className="flex justify-between items-center mb-8">
                                            <span className="text-xs font-bold text-blue-600 uppercase tracking-widest">Question {currentIndex + 1} / {gameWords.length}</span>
                                            <span className="bg-slate-100 px-3 py-1 rounded-full text-xs font-bold text-slate-500">Score: {score}</span>
                                        </div>
                                        <div className="text-center mb-10">
                                            <h3 className="text-4xl sm:text-5xl font-black mb-4">{currentQuestion?.word}</h3>
                                            <div className="h-1.5 w-16 bg-blue-600 mx-auto rounded-full"></div>
                                        </div>
                                        <div className="grid grid-cols-1 gap-3">
                                            {options.map((opt, i) => (
                                                <button key={i} disabled={!!feedback} onClick={() => handleAnswer(opt)} 
                                                    className={`p-5 rounded-2xl border-2 text-left font-semibold transition-all ${feedback ? (opt === currentQuestion.meaning ? 'border-green-500 bg-green-50' : 'opacity-50 border-slate-100') : 'border-slate-100 hover:border-blue-400 hover:bg-blue-50'}`}>
                                                    <span className="inline-block w-8 text-slate-300">{i+1}</span> {opt}
                                                </button>
                                            ))}
                                        </div>
                                        {feedback && (
                                            <div className={`mt-8 p-4 rounded-xl font-bold text-center animate-bounce ${feedback.isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                {feedback.message}
                                            </div>
                                        )}
                                    </>
                                ) : (
                                    <div className="text-center py-6">
                                        <div className="text-6xl mb-4">🎉</div>
                                        <h2 className="text-2xl font-black mb-8">퀴즈 완료!</h2>
                                        <div className="text-7xl font-black text-blue-600 mb-8">{score * 10}<span className="text-2xl text-slate-400">점</span></div>
                                        <button onClick={() => setView('home')} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">홈으로 이동</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Admin View */}
                        {view === 'admin' && (
                            <div className="space-y-6 pb-20 animate-in">
                                <div className="flex items-center justify-between mb-2">
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => setView('home')} className="p-2 text-slate-400">←</button>
                                        <h2 className="text-2xl font-bold">단어장 관리</h2>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={handleSeedDefaultWords} disabled={isSeeding} className="px-3 py-2 bg-emerald-50 text-emerald-600 rounded-xl text-xs font-bold border border-emerald-100 flex items-center gap-1">
                                            {isSeeding ? <span className="animate-spin inline-block">↻</span> : <span>📦</span>}
                                            기본 세트 추가
                                        </button>
                                    </div>
                                </div>

                                <form onSubmit={handleAddWord} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <input type="text" value={newWord} onChange={e => setNewWord(e.target.value)} placeholder="영어 단어 (예: Candidate)" className="p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold" />
                                        <input type="text" value={newMeaning} onChange={e => setNewMeaning(e.target.value)} placeholder="한글 의미 (예: 후보자)" className="p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold" />
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 transition-colors">단어 직접 추가하기</button>
                                </form>

                                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-4 bg-slate-50 border-b text-xs font-bold text-slate-500 uppercase tracking-widest">등록된 단어 목록 ({words.length})</div>
                                    <div className="max-h-[400px] overflow-y-auto divide-y divide-slate-50">
                                        {words.length === 0 ? (
                                            <div className="p-10 text-center text-slate-400 italic">추가된 단어가 없습니다.</div>
                                        ) : (
                                            words.sort((a,b) => b.createdAt?.localeCompare(a.createdAt)).map(w => (
                                                <div key={w.id} className="p-4 flex justify-between items-center group">
                                                    <div>
                                                        <div className="font-bold">{w.word}</div>
                                                        <div className="text-sm text-slate-500 font-medium">{w.meaning}</div>
                                                    </div>
                                                    <button onClick={() => handleDeleteWord(w.id)} className="text-slate-200 hover:text-red-500 p-2 transition-colors">🗑️</button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
